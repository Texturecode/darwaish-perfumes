name: Deploy darwaish perfumes to my server

on:
  push:
    branches: main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: SSH and deploy
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.MY_SSH_KEY }}
          script: |
            cd /root/darwaish-perfumes
            git pull origin main
            npm install
            npm run dev
            pm2 restart 3